on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            deps::.
            any::knitr
            any::rmarkdown
            any::tibble

      - name: Set timezone to Pacific Time
        run: echo "TZ=America/Los_Angeles" >> $GITHUB_ENV

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      # GitHub Pages defaults to a Jekyll build when the deployed branch
      # carries no `.nojekyll` marker. Quarto's rendered output includes
      # llms.txt-style `*.llms.md` files whose literal `{{...}}` text is not
      # valid Liquid, so Jekyll's own build step throws a syntax error and
      # the whole Pages deployment fails silently -- the site then stays
      # frozen on whatever last deployed successfully, while this workflow's
      # own render/push steps keep reporting green.
      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Save Quarto freezer
        uses: actions/cache/save@v6
        with:
          path: _freeze
          key: ${{ runner.os }}-quarto-freezer-${{ github.ref_name }}-${{ github.sha }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site/
          clean-exclude: pr-preview/
          force: false
