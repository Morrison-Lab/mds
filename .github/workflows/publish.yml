# Renders the site and deploys it to the gh-pages branch (which GitHub Pages
# serves), keeping the pr-preview/ subtree.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

# Serialize deploys; `cancel-in-progress: false` so a half-written deploy
# finishes rather than being killed part-way.
concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v3
    with:
      setup-r: true
      r-packages: |
        deps::.
        any::knitr
        any::reticulate
        any::rmarkdown
        any::tibble
      tinytex: true
      # The whole-project PDF pass ran Deno out of memory (a 12 GB heap, exit
      # 133; run 39843335598). Render the other formats in one process each,
      # and the PDFs one file at a time, each in its own process
      # (https://github.com/Morrison-Lab/gha/issues/1170).
      formats: 'html revealjs docx'
      per-file-formats: pdf
      timezone: America/Los_Angeles
      # The full render (every page in html, slides, PDF and docx) outlasts gha's
      # default 45-minute cap. Publishes took 56 to 76 minutes on 2026-10-22,
      # and the build job took 114 minutes on 2026-11-02 (run 41549778937).
      # The next publish hit the 120-minute cap with 14 of 48 PDFs still to go
      # (run 41562044472: html 32, revealjs 30, docx 24 minutes, then PDFs at
      # about 55 seconds a page), so the cap is 180 minutes. Splitting the
      # formats into parallel jobs would cut the wall time instead
      # (https://github.com/Morrison-Lab/gha/issues/1420).
      timeout-minutes: 180
      freeze-cache: true
      checkout-submodules: true
