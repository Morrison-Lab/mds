profile:
  default: website

bibliography: references.bib

editor_options:
  chunk_output_type: console

editor:
  markdown:
    wrap: 72

execute:
  warning: false
  message: false
  cache: false
  freeze: auto

filters:
  - div-anchors
  - slidebreak
  - equation-anchors
  - code-language-labels
  - revealjs-level1-slide-breaks.lua
  - revealjs-html-links.lua
  - page-xrefs.lua
  - math-xrefs.lua

# The pages of a chapter split across several pages, for page-xrefs.lua,
# which resolves @id references from one of them to another, and sends
# links to the old single page (index#id) on to the page holding #id.
page-xrefs:
  - index: algebra.qmd
    pages:
      - algebra-basics.qmd
      - algebra-sums.qmd
      - algebra-exponentials.qmd
      - algebra-trigonometry.qmd
      - algebra-complex.qmd
  - index: calculus.qmd
    pages:
      - calculus-derivatives.qmd
      - calculus-integration.qmd
      - calculus-double-integrals.qmd
  - index: linear-algebra.qmd
    pages:
      - linear-algebra-vectors.qmd
      - linear-algebra-matrices.qmd
      - linear-algebra-subspaces.qmd
      - linear-algebra-rank-nullity.qmd
      - linear-algebra-direct-sums.qmd
      - linear-algebra-inner-products.qmd
      - linear-algebra-special-matrices.qmd
      - linear-algebra-projections.qmd
      - linear-algebra-diagonalization.qmd
      - linear-algebra-complex.qmd
  # linear-algebra-subspaces.qmd was split again, so links to it from before
  # the second split (index#id) go on to the page now holding #id.
  - index: linear-algebra-subspaces.qmd
    pages:
      - linear-algebra-rank-nullity.qmd
      - linear-algebra-direct-sums.qmd

format:
  pdf:
    filters:
      - Morrison-Lab/callouty-theorem
      - coatless-quarto/custom-callout
    include-in-header:
      text: |
        \usepackage{needspace}
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\Needspace{8\baselineskip}}
        % unicode-math's \mathbf prints nothing for Greek letters, so the
        % bold matrices \matr{\Eigvals} and \matr{\covmat} came out blank.
        % \symbfup is the same upright bold, and it has the Greek glyphs.
        \AtBeginDocument{\let\mathbf\symbfup}

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"
